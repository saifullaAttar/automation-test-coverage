# Regenerates mapping.json from automation_web_2.0 @ main and commits the result.
#
# This exists so the report never needs a GitHub token in the browser. The page
# is served from a PUBLIC repo, so any credential shipped in index.html is
# readable by every visitor. CI holds the credential instead; the browser reads
# only committed JSON.
#
# Setup (one time):
#   1. Create a fine-grained PAT with READ-ONLY Contents access to
#      mumzworld-tech/automation_web_2.0 and nothing else.
#   2. Add it here as the repository secret AUTOMATION_REPO_TOKEN.
#
# The TestMO exports are not available to CI, so testmo_tests.json /
# app_testmo_tests.json / web_regression_tests.json stay as committed; only the
# automated-test inventory and the mapping are rebuilt. Re-run `make generate`
# locally after a fresh TestMO export.
name: Refresh coverage from main

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the report
        uses: actions/checkout@v4

      - name: Check out the automation repo (read-only token)
        uses: actions/checkout@v4
        with:
          repository: mumzworld-tech/automation_web_2.0
          token: ${{ secrets.AUTOMATION_REPO_TOKEN }}
          path: automation_web_2.0
          fetch-depth: 0          # extract_tests.py reads origin/main and the AR ticket history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the inventory and mapping
        run: |
          python3 extract_tests.py "$GITHUB_WORKSPACE/automation_web_2.0"
          python3 build_mapping.py
          python3 verify_mapping.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automated_tests.json mapping.json
          if git diff --cached --quiet; then
            echo "No change — main has not moved."
          else
            git commit -m "chore: refresh coverage from automation_web_2.0 main"
            git push
          fi
